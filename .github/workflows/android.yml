# Construit l'APK Android à chaque push sur main (ou à la demande depuis l'onglet Actions).
# Chaque build publie une Release : le lien
#   https://github.com/<compte>/<depot>/releases/latest/download/quete-du-dragon.apk
# pointe donc toujours vers la dernière version.
# En cas d'échec, le journal de compilation est publié dans la pré-release « journal-ci ».
name: Android APK

on:
  push:
    branches: [main, dev, visual-engine-upgrade]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Build web (manifeste des assets, runtime Capacitor, TypeScript)
        run: npm run build

      - name: Projet Android (Capacitor)
        run: |
          set -o pipefail
          ( [ -d android ] || npx cap add android ) 2>&1 | tee ci.log
          npx cap sync android 2>&1 | tee -a ci.log
          # Icône du dragon (générée par scripts/make-icon.py)
          cp -r resources/android/res/. android/app/src/main/res/
          # Appli de montre (tuile Galaxy Watch) : module « wear » ajouté au projet Android
          rm -rf android/wear && cp -r wear android/wear
          grep -q "':wear'" android/settings.gradle || echo "include ':wear'" >> android/settings.gradle

      - name: Compilation de l'APK
        working-directory: android
        run: |
          # Numéro de version croissant : Android accepte la mise à jour par-dessus l'ancienne.
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee -a ../ci.log

      # Publie le journal sur la branche « ci-logs » (lisible sans compte GitHub).
      - name: Journal en cas d'échec
        if: failure()
        run: |
          touch ci.log
          grep -nE "error:|e: |ERR|Error|FAILURE|What went wrong" -A 8 ci.log | head -300 > erreurs.txt || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/logs && cp ci.log erreurs.txt /tmp/logs/
          git checkout --orphan ci-logs
          git rm -rf --cached . -q || true
          cp /tmp/logs/* .
          git add -f ci.log erreurs.txt
          git commit -q -m "Journal du build ${{ github.run_number }}"
          git push -f origin ci-logs

      # Signature avec une clé fixe (signing/) : sans elle, chaque build aurait une clé différente
      # et Android refuserait d'installer la nouvelle version par-dessus l'ancienne.
      - name: Signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks signing/quete-du-dragon.keystore --ks-key-alias quete \
            --ks-pass pass:"$SIGNING_PASSWORD" --key-pass pass:"$SIGNING_PASSWORD" \
            --out quete-du-dragon.apk android/app/build/outputs/apk/debug/app-debug.apk
          $BT/apksigner verify --print-certs quete-du-dragon.apk | head -3
          # même clé pour la montre : indispensable pour que la montre et le téléphone se parlent
          $BT/apksigner sign --ks signing/quete-du-dragon.keystore --ks-key-alias quete \
            --ks-pass pass:"$SIGNING_PASSWORD" --key-pass pass:"$SIGNING_PASSWORD" \
            --out quete-du-dragon-montre.apk android/wear/build/outputs/apk/debug/wear-debug.apk
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD || 'quetedudragon' }}

      - uses: actions/upload-artifact@v4
        with:
          name: quete-du-dragon-apk
          path: |
            quete-du-dragon.apk
            quete-du-dragon-montre.apk

      # Branche de test du moteur graphique : pré-release à part, qui ne remplace PAS le lien « latest » de la famille.
      - name: APK de test (visual-engine-upgrade)
        if: github.ref == 'refs/heads/visual-engine-upgrade'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: visual-test
          name: Test moteur graphique (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          files: |
            quete-du-dragon.apk
            quete-du-dragon-montre.apk

      - name: Release (branche main et tags uniquement)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Version de test n°{0}', github.run_number) }}
          make_latest: true
          files: |
            quete-du-dragon.apk
            quete-du-dragon-montre.apk
