# Construit l'APK Android à chaque push sur main (ou à la demande depuis l'onglet Actions).
# Chaque build publie une Release : le lien
#   https://github.com/<compte>/<depot>/releases/latest/download/quete-du-dragon.apk
# pointe donc toujours vers la dernière version.
# En cas d'échec, le journal de compilation est publié dans la pré-release « journal-ci ».
name: Android APK

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Build web (manifeste des assets, runtime Capacitor, TypeScript)
        run: npm run build

      - name: Projet Android (Capacitor)
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Compilation de l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log

      - name: Journal en cas d'échec
        if: failure()
        run: |
          touch gradle.log
          grep -nE "error:|e: |FAILURE|What went wrong|wrong:" -A 6 gradle.log | head -200 > erreurs.txt || true
          gh release delete journal-ci --yes --cleanup-tag || true
          gh release create journal-ci gradle.log erreurs.txt --prerelease --title "Journal de compilation (échec)" --notes "Build ${{ github.run_number }}" --target ${{ github.sha }}

      - name: Renommage
        run: cp android/app/build/outputs/apk/debug/app-debug.apk quete-du-dragon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quete-du-dragon-apk
          path: quete-du-dragon.apk

      - name: Release (branche main et tags uniquement)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Version de test n°{0}', github.run_number) }}
          make_latest: true
          files: quete-du-dragon.apk
