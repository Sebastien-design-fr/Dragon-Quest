// Appli de montre (Wear OS, Galaxy Watch 4 et suivantes) : la tuile « Quête du Dragon ».
// Même identifiant et même signature que l'appli du téléphone : c'est ce qui leur permet de se parler.
apply plugin: 'com.android.application'

android {
    namespace = "fr.questedudragon.wear"
    compileSdk = rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    defaultConfig {
        applicationId "fr.questedudragon.app"
        minSdkVersion 30
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lintOptions { abortOnError = false }
}

dependencies {
    implementation "androidx.wear.tiles:tiles:1.4.1"
    implementation "androidx.wear.protolayout:protolayout:1.2.1"
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "com.google.guava:guava:33.3.1-android"
}
